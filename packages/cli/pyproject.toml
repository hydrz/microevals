[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microevals-cli"
version = "0.1.0"
description = "MicroEvals Command Line Evaluation Interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "microevals-core",
]

[project.scripts]
microevals = "microevals_cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../../packages/core"]
