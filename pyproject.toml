[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microevals-workspace"
version = "0.1.0"
description = "MicroEvals Monorepo Python Workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/core",
    "packages/cli",
    "apps/api",
]
testpaths = [
    "packages/core/tests",
    "packages/cli/tests",
    "apps/api/tests",
]
