[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microevals-api"
version = "0.1.0"
description = "MicroEvals Backend FastAPI Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "microevals-core",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../../packages/core"]
